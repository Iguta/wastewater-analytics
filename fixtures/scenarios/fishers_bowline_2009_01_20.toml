# 6. Outcome to reproduce -------------------------------------------------------
[outcome]
overflow_volume_gal = { value = 25000, status = "VERIFIED", confidence = 85 }
overflow_volume_tolerance_pct = 20     # simulation must land in [20000, 30000] gal
overflow_duration_min = { value = 500, status = "UNVERIFIED", confidence = 20, note = "25000 / 50 gpm dry inflow; ends ~14:20 EST when power/pumping restored" }
outage_duration_min = { value = 530, status = "UNVERIFIED", confidence = 20 }
early_warning = "none: alarm path dead with the battery"
discovered_by = { value = "not published for 2009; assume residents (as in the 2012 event at the same manhole)", status = "UNVERIFIED", confidence = 30 }
discovery_delay_min = { value = 180, status = "UNVERIFIED", confidence = 15, note = "assumption for scoring: residents notice ~09:00 EST; replace if the IDEM file gives a time" }
affected = { value = "ground and storm sewer leading to Geist Reservoir", status = "UNVERIFIED", confidence = 65, note = "IBJ (2012 event): regulators said sewage did not threaten the reservoir" }

# 7. Expected detector outcome --------------------------------------------------
[expected]
primary = "DETECTABLE_AT_ONSET"
by_variant = { A = "DETECTABLE_AT_ONSET", B = "DETECTABLE_AT_ONSET" }
days_ahead = "NOT_DETECTABLE"
score = "minutes from failure_timestamp_utc to SOURCE_OFFLINE (A) or INVESTIGATE (B), compared with discovery_delay_min"
target_minutes_to_source_offline = 5    # e.g. 5 missed 1-min level samples
must_not = [
  "report NORMAL or treat silence as 'no anomaly' while the source is offline",
  "claim the spill would have been prevented; at best a crew is dispatched earlier",
]
