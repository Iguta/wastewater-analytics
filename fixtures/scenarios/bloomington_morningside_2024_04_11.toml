# 2. Failure mechanism --------------------------------------------------------
# The public record cannot support >=80% on any single mechanism, so there are two variants.
# Variant A is primary. Scores below are relative plausibility, not probabilities of the truth.
[mechanism]
primary_variant = "A"
overall_note = "Record says only 'Equipment failure'. Mechanism is inferred from timing (storm), an upstream blockage 4 days earlier, starter-contact repairs in 2023, and the station's wet-weather overflow history. A and B are tied at 40; A is primary only because it is the one days-ahead hypothesis we can falsify."

[variants.A]
name = "Progressive impeller ragging / clog during a debris-heavy wet spell"
mechanism = { value = "impeller ragging -> duty pump clogs and trips; standby also fouled, firm capacity lost under storm inflow", status = "UNVERIFIED", confidence = 40 }
evidence = [
  "VERIFIED: 2024-04-07 sewer blockage 1,000 gal on E Morningside Rd, same catchment, 4 days earlier",
  "VERIFIED: 2015 grease event at this station",
  "VERIFIED: 6.71 in rain Mar 12-Apr 13, incl. 2.70 in Apr 8-11 (Open-Meteo) washing debris into the system",
  "INFERENCE: ragging is the most common lift-station equipment failure mode in wet weather",
]
precursor_type = { value = "progressive_clog", status = "UNVERIFIED", confidence = 45 }
precursor_onset_days_before = { value = 6, status = "UNVERIFIED", confidence = 30, note = "starts ~2024-04-05, before the 04-07 blockage was reported" }
capacity_lost_pct_at_failure = { value = 100, status = "UNVERIFIED", confidence = 40, note = "duty pump 60% degraded 24 h before failure, then clogs/trips; standby assumed fouled too" }
precursor_shape = { value = "accelerating", status = "UNVERIFIED", confidence = 50 }
failure_timestamp_utc = { value = "2024-04-11T07:00:00Z", status = "UNVERIFIED", confidence = 30, note = "03:00 EDT, start of the second storm burst on the recorded date; record has no time" }
backup_failed = { value = false, status = "UNVERIFIED", confidence = 50, note = "no backup power issue reported; alarm assumed to work (overflow ended same day)" }
expected_detector_outcome = { value = "PREDICTABLE_DAYS_AHEAD", status = "UNVERIFIED", confidence = 45, note = "only if the clog precursor existed: rising per-cycle runtime / more standby assists in the days before" }

[variants.B]
name = "Sudden pump/motor or control trip under storm load (no precursor)"
mechanism = { value = "motor overload, VFD/starter fault or level-control failure during peak storm inflow", status = "UNVERIFIED", confidence = 40 }
evidence = [
  "VERIFIED: failure coincides with the heaviest rain of the window (Apr 10-11)",
  "VERIFIED: record has no subtype; an electrical/control fault fits 'Equipment failure' equally well",
  "VERIFIED: 2023 CBU Utilities Service Board agenda: 'Starter contacts for Morningside Lift Station - TD23-232' and auxiliary contacts replaced (https://bloomington.in.gov/onboard/meetingFiles/12187/download)",
  "VERIFIED: 2023 'ENG23-036 Lift Station Construction Permit - Morningside Dr'; USB minutes 2024-12-16 list 'rebuilding the Morningside and Basswood lift stations' as a 2024 achievement (https://bloomington.in.gov/onboard/meetingFiles/14424/download)",
]
precursor_type = { value = "none", status = "UNVERIFIED", confidence = 35 }
precursor_onset_days_before = { value = 0, status = "UNVERIFIED", confidence = 35 }
capacity_lost_pct_at_failure = { value = 100, status = "UNVERIFIED", confidence = 40 }
precursor_shape = { value = "none", status = "UNVERIFIED", confidence = 35 }
failure_timestamp_utc = { value = "2024-04-11T07:00:00Z", status = "UNVERIFIED", confidence = 30 }
backup_failed = { value = false, status = "UNVERIFIED", confidence = 50 }
expected_detector_outcome = { value = "DETECTABLE_AT_ONSET", status = "UNVERIFIED", confidence = 60, note = "pumps stop while level/inflow rise; must not be suppressed as 'just rain'" }

[mechanism.other]
note = "Remaining ~20%: check-valve failure, float/controller fault, wear-ring wear. Not modeled in v1."

