# LOCKED BENCHMARK SCENARIO. Do not edit in place: any change gets a new `version`
# (and a new file if the id changes). Tune on randomized variants, never on this exact scenario.
#
# Field convention: { value, status, confidence, source?, note? }
#   status     = VERIFIED (checked against the cited public record) | UNVERIFIED (assumption or inference)
#   confidence = 0-100, our confidence the value is right
# Wessex telemetry is used only for station *hydraulics*; Indiana rain is never mixed into Wessex training.

id = "bloomington_morningside_2024_04_11"
version = "v2"
changelog = ["v1 2026-11-07: initial lock", "v2 2026-11-07: add day-ahead forecast pin in [conditions] (Dhruv ask); no other field changed"]
locked = true
