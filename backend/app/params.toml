# Detector + policy parameters (ARCHITECTURE.md §4.14). Frozen per version; tuned only on the 2022 dev tier.
version = "dragonfly-ci-v1"
k = 0.5
U = 4
h_w = 3
h_i = 6
W = 60
G = 14
min_effect = -8.0  # % capacity change required to enter INVESTIGATE (§4.6); dev grid -5, -8, -12
min_valid_cycles = 20   # fixed, not tuned
min_baseline_days = 30  # fixed
reopen_days = 7         # fixed: recurrence within 7 days of closing reopens the incident
S_max = 12.0            # fixed: CUSUM ceiling = 2*h_i default; see reports/decisions.md D1
sibling_mode = "shared_drop"  # fixed: "shared_drop" or "spec"; see reports/decisions.md D2

# Ablation switches (§4.15). The shipped model has all three on.
persistence = true
inhibition = true
quality_gate = true
